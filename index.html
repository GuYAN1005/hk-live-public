<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hong Kong Live</title>
  <meta name="description" content="Live Hong Kong dashboard: weather, MTR Island Line and air quality.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%235eead4'/></svg>">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Hong Kong Live</h1>
      <p class="identity">Gu Yan · Electrical and Computer Engineering（communication engineering）</p>
      <p class="description">This dashboard will show Hong Kong local information including weather, transport and air&nbsp;quality.</p>
    </header>

    <section class="cards" aria-label="Dashboard sections">
      <article class="card" data-card="weather">
        <div class="card-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </span>
          <h2>Weather</h2>
          <button class="refresh" type="button" aria-label="Refresh weather">↻</button>
        </div>
        <div class="weather" id="weather"><div class="skeleton"></div></div>
        <div class="weather-art" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="120" height="120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <circle cx="50" cy="50" r="18"/>
            <path d="M50 16v8M50 76v8M16 50h8M76 50h8M26 26l6 6M68 68l6 6M74 26l-6 6M32 68l-6 6"/>
          </svg>
        </div>
      </article>

      <article class="card" data-card="transport">
        <div class="card-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="6" y="3" width="12" height="14" rx="3"/>
              <path d="M6 11h12M9 18l-2 3M15 18l2 3"/>
            </svg>
          </span>
          <h2>Transport</h2>
          <button class="refresh" type="button" aria-label="Refresh transport">↻</button>
        </div>
        <div class="transport" id="transport"><div class="skeleton"></div></div>
      </article>

      <article class="card" data-card="air-quality">
        <div class="card-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 12c0-3 2-5 5-5h5a3 3 0 0 1 0 6H9"/>
              <path d="M12 13v5"/>
            </svg>
          </span>
          <h2>Air Quality</h2>
          <button class="refresh" type="button" aria-label="Refresh air quality">↻</button>
        </div>
        <div class="air-quality" id="air-quality"><div class="skeleton"></div></div>
        <div class="aq-art" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="110" height="110" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 80 C20 40, 50 20, 80 20 C80 55, 55 80, 20 80 Z"/>
            <path d="M20 80 C35 60, 55 45, 75 28"/>
          </svg>
        </div>
      </article>
    </section>
  </main>
  <footer class="site-footer">Data from the Hong Kong Government and DATA.GOV.HK.</footer>
  <div class="frog" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="84" height="84">
      <!-- small head -->
      <circle cx="50" cy="22" r="13" fill="#ffd93d"/>
      <!-- big pear body -->
      <path d="M50 30 C30 30 24 52 26 68 C28 86 38 95 50 95 C62 95 72 86 74 68 C76 52 70 30 50 30 Z" fill="#ffd93d"/>
      <!-- cream belly -->
      <ellipse cx="50" cy="66" rx="17" ry="15" fill="#f0e0b8"/>
      <!-- open eyes (teal, pupils track cursor) -->
      <g class="eyes-open">
        <circle cx="44" cy="19" r="5" fill="#9fe6c4"/>
        <circle cx="56" cy="19" r="5" fill="#9fe6c4"/>
        <circle class="pupil" cx="44" cy="19" r="2.2" fill="#1f2933"/>
        <circle class="pupil" cx="56" cy="19" r="2.2" fill="#1f2933"/>
      </g>
      <!-- happy closed eyes when laughing -->
      <g class="eyes-closed">
        <path d="M39 19 Q44 15 49 19" stroke="#1f2933" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M51 19 Q56 15 61 19" stroke="#1f2933" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- normal small mouth -->
      <path class="mouth-normal" d="M46 29 Q50 32 54 29" stroke="#1f2933" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- huge open laughing mouth -->
      <ellipse class="mouth-laugh" cx="50" cy="29" rx="7" ry="9" fill="#3a2020"/>
      <!-- dark arms clasped on belly -->
      <path d="M28 52 Q38 60 46 62" stroke="#6b5b3e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M72 52 Q62 60 54 62" stroke="#6b5b3e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- stubby feet -->
      <ellipse cx="40" cy="95" rx="6" ry="3" fill="#6b5b3e"/>
      <ellipse cx="60" cy="95" rx="6" ry="3" fill="#6b5b3e"/>
    </svg>
  </div>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
